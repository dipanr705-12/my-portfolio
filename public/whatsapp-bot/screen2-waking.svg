<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <radialGradient id="bgGlow2" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#1c283b" />
      <stop offset="100%" stop-color="#141d2b" />
    </radialGradient>
    <filter id="cardShadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#060b13" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="url(#bgGlow2)" />

  <!-- Centered Card -->
  <g transform="translate(522, 268)" filter="url(#cardShadow2)">
    <rect width="556" height="340" rx="24" fill="#1e2736" stroke="#2f3b4e" stroke-width="1.5" />

    <!-- Circular Spinner -->
    <circle cx="278" cy="86" r="26" fill="none" stroke="#253545" stroke-width="4" />
    <path d="M 301 73 A 26 26 0 0 1 291 108" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round" />

    <!-- Title -->
    <text x="278" y="168" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Inter, Arial, sans-serif" font-weight="700" font-size="28">Waking up...</text>

    <!-- Subtitle -->
    <text x="278" y="214" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16">Initializing Puppeteer and generating session. This may</text>
    <text x="278" y="238" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16">take a moment on Render's free tier.</text>
  </g>
</svg>
