<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#191670" />
      <stop offset="50%" stop-color="#692669" />
      <stop offset="100%" stop-color="#c3225a" />
    </linearGradient>
    <linearGradient id="card1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.08" />
    </linearGradient>
    <linearGradient id="blueBtn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00b4ff" />
      <stop offset="100%" stop-color="#0077ff" />
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg1)" />

  <!-- Decorative Snowflakes -->
  <g fill="#ffffff" fill-opacity="0.65" font-family="sans-serif" font-size="22">
    <text x="110" y="75">❄</text>
    <text x="580" y="25">❄</text>
    <text x="765" y="135">❄</text>
    <text x="1010" y="185">❄</text>
    <text x="1285" y="70">❄</text>
    <text x="1380" y="135">❄</text>
    <text x="1420" y="340">❄</text>
    <text x="890" y="510">❄</text>
    <text x="985" y="445">❄</text>
    <text x="1405" y="470">❄</text>
    <text x="875" y="690">❄</text>
    <text x="1200" y="810">❄</text>
    <text x="1490" y="865">❄</text>
    <text x="255" y="805">❄</text>
    <text x="640" y="825">❄</text>
    <text x="45" y="735">❄</text>
  </g>

  <!-- Login Button Top Right -->
  <rect x="1475" y="16" width="108" height="54" rx="27" fill="#fbbf24" />
  <text x="1529" y="50" text-anchor="middle" fill="#1a1a1a" font-family="Segoe UI, Arial, sans-serif" font-weight="700" font-size="19">👤 Login</text>

  <!-- Header -->
  <text x="800" y="74" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-weight="800" font-size="48">winter guidance</text>
  <text x="800" y="110" text-anchor="middle" fill="#f0e6f6" font-family="Segoe UI, Arial, sans-serif" font-size="20">Basically it usable in India</text>

  <!-- Main Glass Card -->
  <rect x="15" y="170" width="1570" height="520" rx="18" fill="url(#card1)" stroke="#ffffff" stroke-opacity="0.12" />

  <text x="38" y="235" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-weight="700" font-size="33">Important Things About Winter Season</text>

  <g fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="21">
    <circle cx="44" cy="274" r="4" />
    <text x="58" y="281">Winter is the coldest season of the year.</text>

    <circle cx="44" cy="314" r="4" />
    <text x="58" y="321">In India, winter usually lasts from December to February.</text>

    <circle cx="44" cy="354" r="4" />
    <text x="58" y="361">Days are cool and nights are very cold.</text>

    <circle cx="44" cy="394" r="4" />
    <text x="58" y="401">Fog and frost are common in many regions.</text>

    <circle cx="44" cy="434" r="4" />
    <text x="58" y="441">People wear warm clothes like sweaters, jackets, caps, and gloves.</text>

    <circle cx="44" cy="474" r="4" />
    <text x="58" y="481">Hot food and drinks such as soup, tea, and milk are preferred.</text>

    <circle cx="44" cy="514" r="4" />
    <text x="58" y="521">Common health problems include cold, cough, and flu.</text>

    <circle cx="44" cy="554" r="4" />
    <text x="58" y="561">Rabi crops like wheat and mustard grow in winter.</text>

    <circle cx="44" cy="594" r="4" />
    <text x="58" y="601">Many trees shed their leaves during this season.</text>

    <circle cx="44" cy="634" r="4" />
    <text x="58" y="641">Winter festivals include Christmas, New Year, Lohri, Makar Sankranti, and Pongal.</text>
  </g>

  <!-- Bottom Left Card: Pre-Winter -->
  <rect x="15" y="742" width="772" height="156" rx="18" fill="url(#card1)" stroke="#00f2fe" stroke-width="3" />
  <rect x="42" y="772" width="182" height="68" rx="34" fill="url(#blueBtn)" />
  <text x="133" y="814" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-weight="700" font-size="22">❄ Pre-Winter</text>
  <text x="42" y="866" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="21">Official Seasons : November and December</text>

  <!-- Bottom Right Card: Winter -->
  <rect x="810" y="742" width="775" height="156" rx="18" fill="url(#card1)" stroke="#facc15" stroke-width="3" />
  <rect x="836" y="772" width="142" height="68" rx="34" fill="#dcebfb" />
  <text x="907" y="814" text-anchor="middle" fill="#0f2942" font-family="Segoe UI, Arial, sans-serif" font-weight="700" font-size="22">🧤 Winter</text>
  <text x="836" y="866" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="21">Official Seasons : January and February</text>

  <!-- Rate Us & Helpline Pills -->
  <rect x="15" y="914" width="120" height="58" rx="29" fill="#fbbf24" />
  <text x="75" y="950" text-anchor="middle" fill="#1a1a1a" font-family="Segoe UI, Arial, sans-serif" font-weight="700" font-size="19">⭐ Rate Us</text>

  <rect x="1456" y="914" width="128" height="58" rx="29" fill="#ef4444" />
  <text x="1520" y="950" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-weight="700" font-size="19">🆘 Helpline</text>

  <!-- Footer -->
  <text x="800" y="968" text-anchor="middle" fill="#e2d9f3" font-family="Segoe UI, Arial, sans-serif" font-size="18">© 2026 | Team laksha cracker</text>
</svg>
