<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0C0C0C" />
      <stop offset="100%" stop-color="#141418" />
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#787D88" />
      <stop offset="100%" stop-color="#D7E2EA" />
    </linearGradient>
    <linearGradient id="accentBtn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18011F" />
      <stop offset="37%" stop-color="#B600A8" />
      <stop offset="72%" stop-color="#7621B0" />
      <stop offset="100%" stop-color="#BE4C00" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="700" fill="url(#bgGrad)" />

  <!-- Navbar -->
  <text x="60" y="70" fill="#D7E2EA" font-family="sans-serif" font-weight="600" font-size="20">ABOUT</text>
  <text x="380" y="70" fill="#D7E2EA" font-family="sans-serif" font-weight="600" font-size="20">DOWNLOAD CV</text>
  <text x="760" y="70" fill="#D7E2EA" font-family="sans-serif" font-weight="600" font-size="20">PROJECTS</text>
  <text x="1060" y="70" fill="#D7E2EA" font-family="sans-serif" font-weight="600" font-size="20">CONTACT</text>

  <!-- Main Hero Heading -->
  <text x="600" y="240" fill="url(#titleGrad)" font-family="sans-serif" font-weight="900" font-size="110" text-anchor="middle" letter-spacing="-2">HI, I'M DIPAN</text>

  <!-- Electronics Glow Ring -->
  <circle cx="600" cy="460" r="160" fill="none" stroke="#FFEA00" stroke-width="2" stroke-dasharray="20 12" opacity="0.6" />
  <circle cx="600" cy="460" r="140" fill="none" stroke="#38BDF8" stroke-width="2" stroke-dasharray="35 25" opacity="0.5" />

  <!-- Pikachu Face Placeholder in Center -->
  <circle cx="600" cy="460" r="110" fill="#FFEA00" />
  <!-- Ears -->
  <polygon points="510,380 430,270 480,410" fill="#FFEA00" />
  <polygon points="430,270 460,310 445,340" fill="#141414" />
  <polygon points="690,380 770,270 720,410" fill="#FFEA00" />
  <polygon points="770,270 740,310 755,340" fill="#141414" />
  <!-- Eyes -->
  <circle cx="560" cy="440" r="16" fill="#141414" />
  <circle cx="565" cy="434" r="6" fill="#FFFFFF" />
  <circle cx="640" cy="440" r="16" fill="#141414" />
  <circle cx="635" cy="434" r="6" fill="#FFFFFF" />
  <!-- Cheeks -->
  <circle cx="530" cy="480" r="18" fill="#F01124" />
  <circle cx="670" cy="480" r="18" fill="#F01124" />
  <!-- Smile -->
  <path d="M 575 480 Q 600 505 625 480" fill="none" stroke="#141414" stroke-width="5" stroke-linecap="round" />

  <!-- Bottom Bar -->
  <text x="60" y="650" fill="#D7E2EA" font-family="sans-serif" font-weight="300" font-size="18">WHERE ELECTRONICS MEETS CODE, MY JOURNEY BEGINS</text>
  <rect x="960" y="615" width="180" height="50" rx="25" fill="url(#accentBtn)" stroke="#FFFFFF" stroke-width="2" />
  <text x="1050" y="646" fill="#FFFFFF" font-family="sans-serif" font-weight="600" font-size="15" text-anchor="middle">CONTACT ME</text>
</svg>
