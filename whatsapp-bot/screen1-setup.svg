<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#1c283b" />
      <stop offset="100%" stop-color="#141d2b" />
    </radialGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#060b13" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="url(#bgGlow)" />

  <!-- Centered Card -->
  <g transform="translate(560, 198)" filter="url(#cardShadow)">
    <rect width="480" height="504" rx="24" fill="#1e2736" stroke="#2f3b4e" stroke-width="1.5" />

    <!-- SETUP REQUIRED Badge -->
    <rect x="170" y="50" width="140" height="34" rx="17" fill="#2d2b24" />
    <text x="240" y="72" text-anchor="middle" fill="#f59e0b" font-family="Segoe UI, Inter, Arial, sans-serif" font-weight="700" font-size="13" letter-spacing="0.6">SETUP REQUIRED</text>

    <!-- Title -->
    <text x="240" y="136" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Inter, Arial, sans-serif" font-weight="700" font-size="27">Welcome to WhatsApp Bot</text>

    <!-- Subtitle -->
    <text x="240" y="182" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15.5">Please enter the phone number (with country code)</text>
    <text x="240" y="206" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15.5">where you want to forward photos.</text>

    <!-- Input Box -->
    <rect x="44" y="250" width="392" height="56" rx="12" fill="#283243" stroke="#3b475c" stroke-width="1.5" />
    <text x="64" y="284" fill="#6b7b93" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="17">e.g. 918250885181</text>

    <!-- Start Botting Button -->
    <rect x="44" y="322" width="392" height="50" rx="12" fill="#10b981" />
    <text x="240" y="353" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Inter, Arial, sans-serif" font-weight="700" font-size="16">Start Botting</text>

    <!-- Footer Caption -->
    <text x="240" y="416" text-anchor="middle" fill="#8b9bb4" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13.5">Photos received by your linked WhatsApp will be sent here.</text>
  </g>
</svg>
